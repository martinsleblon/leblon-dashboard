<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Organograma — Leblon Rolamentos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1e2228;color:#1a1a2e;min-height:100vh}

.hdr{background:linear-gradient(135deg,#1B2A4A,#2D5986);padding:.8rem 1.4rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d}
.logo{font-size:15px;font-weight:800;color:#fff}.logo b{color:#63B3ED}
.back{font-size:11px;color:#fff;text-decoration:none;padding:5px 14px;border:1px solid #ffffff44;border-radius:6px;transition:background .15s}
.back:hover{background:#ffffff22}

.page{background:#2a2f38;min-height:calc(100vh - 49px);padding:2rem 2rem 4rem}
.ptit{font-size:22px;font-weight:700;color:#f0f4f8;margin-bottom:.2rem}
.psub{font-size:12px;color:#8b98a8;margin-bottom:1.5rem}

.leg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2rem}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#8b98a8}
.leg-dot{width:10px;height:10px;border-radius:50%}

.hint{font-size:11px;color:#8b98a8;margin-bottom:2rem;padding:.5rem .9rem;background:#323840;border-radius:6px;border-left:3px solid #4a5568;display:inline-block}

/* CANVAS WRAPPER */
.org-canvas{overflow-x:auto;overflow-y:auto;padding:1rem 0 2rem}
.org-inner{position:relative;min-width:1100px}

/* AVATAR */
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;border:3px solid}

/* CARD */
.org-card{background:#f8fafc;border-radius:14px;padding:.9rem 1.1rem 1rem;width:185px;position:absolute;cursor:pointer;transition:box-shadow .2s,transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.org-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.28);transform:translateY(-2px)}
.org-card .card-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.org-card .card-name{font-size:13px;font-weight:800;color:#1a202c;line-height:1.2}
.org-card .card-role{font-size:10px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.org-card .card-dept{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;display:inline-block;margin-bottom:5px}
.org-card .card-fns{display:none;margin-top:8px;border-top:1px solid #e2e8f0;padding-top:8px}
.org-card .card-fns li{font-size:11px;color:#4a5568;line-height:1.85;list-style:none;padding-left:12px;position:relative}
.org-card .card-fns li::before{content:"›";position:absolute;left:0;color:#a0aec0}
.org-card.open .card-fns{display:block}
.org-card .chevron{position:absolute;top:.75rem;right:.8rem;font-size:11px;color:#a0aec0;transition:transform .2s}
.org-card.open .chevron{transform:rotate(180deg)}
.ec-badge{font-size:9px;padding:1px 6px;border-radius:99px;background:#FED7D7;color:#C53030;display:inline-block;margin-top:3px}

/* LIDERANCA */
.card-L .avatar{background:linear-gradient(135deg,#2B6CB0,#63B3ED);border-color:#2B6CB0}
.card-L .card-dept{background:#EBF8FF;color:#2B6CB0}
.card-L{border-top:4px solid #3182CE}

/* FINANCEIRO */
.card-F .avatar{background:linear-gradient(135deg,#553C9A,#9F7AEA);border-color:#553C9A}
.card-F .card-dept{background:#FAF5FF;color:#553C9A}
.card-F{border-top:4px solid #6B46C1}

/* COMPRAS */
.card-C .avatar{background:linear-gradient(135deg,#C05621,#ED8936);border-color:#C05621}
.card-C .card-dept{background:#FFFAF0;color:#C05621}
.card-C{border-top:4px solid #DD6B20}

/* COMERCIAL */
.card-V .avatar{background:linear-gradient(135deg,#276749,#48BB78);border-color:#276749}
.card-V .card-dept{background:#F0FFF4;color:#276749}
.card-V{border-top:4px solid #2F855A}

/* LOGISTICA */
.card-G .avatar{background:linear-gradient(135deg,#975A16,#F6AD55);border-color:#975A16}
.card-G .card-dept{background:#FFFBEB;color:#975A16}
.card-G{border-top:4px solid #B7791F}

/* APOIO */
.card-S .avatar{background:linear-gradient(135deg,#4A5568,#718096);border-color:#4A5568}
.card-S .card-dept{background:#F7FAFC;color:#4A5568}
.card-S{border-top:4px solid #4A5568}

/* SVG LINHAS */
.org-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">Leblon <b>Rolamentos</b></div>
  <a class="back" href="index.html">&#8592; Dashboard</a>
</div>

<div class="page">
  <div class="ptit">Organograma</div>
  <div class="psub">Leblon Rolamentos &mdash; Estrutura de equipe 2026</div>

  <div class="leg">
    <div class="leg-item"><div class="leg-dot" style="background:#3182CE"></div>Lideranca</div>
    <div class="leg-item"><div class="leg-dot" style="background:#6B46C1"></div>Financeiro</div>
    <div class="leg-item"><div class="leg-dot" style="background:#DD6B20"></div>Compras</div>
    <div class="leg-item"><div class="leg-dot" style="background:#2F855A"></div>Comercial</div>
    <div class="leg-item"><div class="leg-dot" style="background:#B7791F"></div>Logistica</div>
  </div>
  <div class="hint">Clique em qualquer card para ver as funcoes</div>

  <div class="org-canvas">
    <div class="org-inner" id="org-inner">
      <svg class="org-svg" id="org-svg"></svg>
    </div>
  </div>
</div>

<script>
// ---- DADOS ----
var NODES = [
  {id:'valdomiro', name:'Valdomiro', role:'CEO e Fundador',         dept:'L', initials:'V',  parent:null,
   fns:['Visao estrategica da empresa','Decisoes societarias e de expansao','Relacionamento com fornecedores-chave','Aprovacao de investimentos']},
  {id:'rafael',   name:'Rafael',    role:'Diretor Geral',           dept:'L', initials:'R',  parent:'valdomiro',
   fns:['Gestao comercial e estrategica','Operacoes e processos internos','Treinamento e desenvolvimento do time','Gestao de importacoes e compras','Indicadores e metas']},
  {id:'tarsilla', name:'Tarsilla',  role:'Diretora Financeira',     dept:'F', initials:'T',  parent:'rafael',
   fns:['Gestao financeira Leblon Rolamentos','Supervisao financeira LBN','Fechamento de importacoes','Fluxo de caixa','Relatorios financeiros consolidados']},
  {id:'neusa',    name:'Neusa',     role:'Gestora Financeira LBN',  dept:'F', initials:'N',  parent:'rafael',
   fns:['Gestao financeira LBN','Contas a pagar e receber LBN','Controle de notas fiscais','Suporte a Diretoria Financeira']},
  {id:'karina',   name:'Karina',    role:'Auxiliar Financeira',     dept:'F', initials:'K',  parent:'tarsilla', parent2:'neusa',
   fns:['Suporte financeiro Leblon e LBN','Lancamentos e conciliacoes','Organizacao de documentos fiscais','Apoio a Tarsilla e Neusa']},
  {id:'lucask',   name:'Lucas K.',  role:'Compras',                 dept:'C', initials:'LK', parent:'rafael',
   fns:['Gestao de pedidos de compra','Relacionamento com fornecedores','Controle de estoque e reposicao','Suporte ao planejamento de importacao']},
  {id:'leticia',  name:'Leticia',   role:'Consultora Comercial',    dept:'V', initials:'LE', parent:'rafael',
   fns:['Prospeccao e atendimento de clientes','Gestao da carteira ativa','Negociacao e fechamento','Foco LBN ID 91%']},
  {id:'thiago',   name:'Thiago',    role:'Consultor Comercial',     dept:'V', initials:'TH', parent:'rafael',
   fns:['Prospeccao e atendimento de clientes','Gestao da carteira ativa','Negociacao e fechamento','Mix 60% LBN ID']},
  {id:'bruna',    name:'Bruna',     role:'Consultora Comercial',    dept:'V', initials:'BR', parent:'rafael',
   fns:['Prospeccao e atendimento de clientes','Gestao de grandes contas','Negociacao e fechamento','Maior carteira 2026']},
  {id:'miriam',   name:'Miriam',    role:'Consultora Comercial',    dept:'V', initials:'MI', parent:'rafael',
   fns:['Prospeccao e atendimento de clientes','Gestao da carteira ativa','Negociacao e fechamento','Maior volume de pedidos 2026']},
  {id:'sdr1',     name:'SDR 1',     role:'Pre-vendas',              dept:'V', initials:'S1', parent:'rafael',
   fns:['Prospeccao ativa de novos clientes','Qualificacao de leads','Agendamento de contatos','Suporte ao time comercial']},
  {id:'sdr2',     name:'SDR 2',     role:'Pre-vendas',              dept:'V', initials:'S2', parent:'rafael', ec:true,
   fns:['Prospeccao ativa de novos clientes','Qualificacao de leads','Agendamento de contatos','Suporte ao time comercial']},
  {id:'sergio',   name:'Sergio',    role:'Resp. de Logistica',      dept:'G', initials:'SE', parent:'rafael',
   fns:['Gestao das operacoes de logistica','Coordenacao da equipe de entrega','Controle de expedicao e recebimento','Organizacao do estoque fisico']},
  {id:'lucasg',   name:'Lucas G.',  role:'Auxiliar de Logistica',   dept:'G', initials:'LG', parent:'sergio',
   fns:['Separacao e conferencia de pedidos','Apoio a expedicao','Organizacao do estoque']},
  {id:'henrique', name:'Henrique',  role:'Auxiliar de Logistica',   dept:'G', initials:'HE', parent:'sergio',
   fns:['Separacao e conferencia de pedidos','Apoio a expedicao','Organizacao do estoque']},
  {id:'marcos',   name:'Marcos',    role:'Motoboy',                 dept:'G', initials:'MA', parent:'sergio',
   fns:['Entregas externas','Coletas e retiradas','Suporte a logistica']},
  {id:'rafinha',  name:'Rafinha',   role:'Motoboy',                 dept:'G', initials:'RA', parent:'sergio',
   fns:['Entregas externas','Coletas e retiradas','Suporte a logistica']},
  {id:'irene',    name:'Irene',     role:'Servicos Gerais',         dept:'S', initials:'IR', parent:'sergio',
   fns:['Limpeza e organizacao do escritorio','Conservacao do ambiente de trabalho']},
];

var DEPT_LABEL = {L:'Lideranca',F:'Financeiro',C:'Compras',V:'Comercial',G:'Logistica',S:'Apoio'};

// ---- LAYOUT ----
// Posicoes fixas (cx, cy) = centro do card. Card: 185x auto
var CW = 185, CH = 110; // largura e altura base do card
var GAP_Y = 80; // espaco vertical entre niveis

// Nivel 0: Valdomiro
// Nivel 1: Rafael
// Nivel 2: Tarsilla, Neusa, LucasK, Leticia, Thiago, Bruna, Miriam, SDR1, SDR2, Sergio
// Nivel 3: Karina (abaixo de Tarsilla/Neusa), LucasG, Henrique, Marcos, Rafinha, Irene

var POS = {
  valdomiro: {x: 500, y: 20},
  rafael:    {x: 500, y: 180},
  // nivel 2 — espaçados horizontalmente
  tarsilla:  {x: 30,  y: 360},
  neusa:     {x: 230, y: 360},
  lucask:    {x: 430, y: 360},
  leticia:   {x: 620, y: 360},
  thiago:    {x: 815, y: 360},
  bruna:     {x: 1010,y: 360},
  miriam:    {x: 1205,y: 360},
  sdr1:      {x: 1400,y: 360},
  sdr2:      {x: 1595,y: 360},
  sergio:    {x: 1790,y: 360},
  // nivel 3
  karina:    {x: 130, y: 560},
  lucasg:    {x: 1590,y: 560},
  henrique:  {x: 1790,y: 560},
  marcos:    {x: 1990,y: 560},
  rafinha:   {x: 2190,y: 560},
  irene:     {x: 2390,y: 560},
};

// ---- BUILD ----
function byId(id){ for(var i=0;i<NODES.length;i++) if(NODES[i].id===id) return NODES[i]; return null; }

function makeCard(n){
  var pos = POS[n.id];
  var el = document.createElement('div');
  el.className = 'org-card card-'+n.dept;
  el.id = 'card_'+n.id;
  el.style.left = pos.x+'px';
  el.style.top  = pos.y+'px';
  if(n.ec) el.style.opacity = '0.65';

  var deptLabel = DEPT_LABEL[n.dept];
  var fnHTML = '<ul class="card-fns">';
  n.fns.forEach(function(f){ fnHTML += '<li>'+f+'</li>'; });
  fnHTML += '</ul>';

  var ecBadge = n.ec ? '<div class="ec-badge">Em contratacao</div>' : '';

  el.innerHTML = (
    '<span class="chevron">&#9660;</span>'+
    '<div class="card-dept">'+deptLabel+'</div>'+
    '<div class="card-top">'+
      '<div class="avatar">'+n.initials+'</div>'+
      '<div>'+
        '<div class="card-name">'+n.name+'</div>'+
        '<div class="card-role">'+n.role+'</div>'+
        ecBadge+
      '</div>'+
    '</div>'+
    fnHTML
  );
  el.addEventListener('click', function(){ el.classList.toggle('open'); });
  return el;
}

// Cor da linha por departamento pai
var LINE_COLOR = {L:'#3182CE',F:'#6B46C1',C:'#DD6B20',V:'#2F855A',G:'#B7791F',S:'#4A5568'};

function drawLine(svg, x1,y1,x2,y2, color){
  var mid = (y1+y2)/2;
  var d = 'M'+x1+' '+y1+' C'+x1+' '+mid+','+x2+' '+mid+','+x2+' '+y2;
  var path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width','2');
  path.setAttribute('fill','none');
  path.setAttribute('stroke-dasharray','0');
  path.setAttribute('opacity','0.7');
  svg.appendChild(path);
}

function cardBottom(id){ var p=POS[id]; return {x: p.x+CW/2, y: p.y+CH}; }
function cardTop(id){    var p=POS[id]; return {x: p.x+CW/2, y: p.y}; }

window.addEventListener('load', function(){
  var inner = document.getElementById('org-inner');
  var svg   = document.getElementById('org-svg');

  // Calcular tamanho do canvas
  var maxX=0,maxY=0;
  Object.keys(POS).forEach(function(k){ if(POS[k].x+CW>maxX)maxX=POS[k].x+CW; if(POS[k].y+200>maxY)maxY=POS[k].y+200; });
  inner.style.width  = maxX+40+'px';
  inner.style.height = maxY+40+'px';
  svg.setAttribute('width',  maxX+40);
  svg.setAttribute('height', maxY+40);

  // Criar cards
  NODES.forEach(function(n){ inner.appendChild(makeCard(n)); });

  // Desenhar linhas
  // Valdomiro -> Rafael
  var b=cardBottom('valdomiro'), t=cardTop('rafael');
  drawLine(svg, b.x,b.y, t.x,t.y, LINE_COLOR.L);

  // Rafael -> nivel 2
  ['tarsilla','neusa','lucask','leticia','thiago','bruna','miriam','sdr1','sdr2','sergio'].forEach(function(id){
    var n = byId(id);
    var b2=cardBottom('rafael'), t2=cardTop(id);
    drawLine(svg, b2.x,b2.y, t2.x,t2.y, LINE_COLOR[n.dept]);
  });

  // Tarsilla+Neusa -> Karina (linhas pontilhadas duplas)
  [['tarsilla','#6B46C1'],['neusa','#6B46C1']].forEach(function(pair){
    var b3=cardBottom(pair[0]), t3=cardTop('karina');
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    var mid3 = (b3.y+t3.y)/2;
    path.setAttribute('d','M'+b3.x+' '+b3.y+' C'+b3.x+' '+mid3+','+t3.x+' '+mid3+','+t3.x+' '+t3.y);
    path.setAttribute('stroke',pair[1]);
    path.setAttribute('stroke-width','2');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-dasharray','5,4');
    path.setAttribute('opacity','0.6');
    svg.appendChild(path);
  });

  // Sergio -> nivel 3
  ['lucasg','henrique','marcos','rafinha','irene'].forEach(function(id){
    var n=byId(id);
    var b4=cardBottom('sergio'), t4=cardTop(id);
    drawLine(svg, b4.x,b4.y, t4.x,t4.y, LINE_COLOR[n.dept]);
  });
});
</script>
</body>
</html>
